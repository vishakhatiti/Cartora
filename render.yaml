# Render Blueprint for the Cartora API. Keys only: values are entered in the Render dashboard
# (sync: false) or generated by Render (generateValue: true). Never put real secrets in this file.
services:
  - type: web
    name: cartora-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    # Liveness only. The server exits at startup if MongoDB cannot be reached, so Render restarts it.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # You enter these when you create the Blueprint:
      - key: CLIENT_URL # your Vercel URL, for example https://cartora.vercel.app
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_HOST # only the host, for example cluster0.abcde.mongodb.net
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      # Render creates these random values for you:
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
