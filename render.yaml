# Render Blueprint for the Cartora API. Keys only: values are entered in the Render dashboard
# (sync: false) or generated by Render (generateValue: true). Never put real secrets in this file.
services:
  - type: web
    name: cartora-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    # Liveness only. The server exits at startup if MongoDB cannot be reached, so Render restarts it.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # You enter these when you create the Blueprint:
      - key: FRONTEND_URL # your Vercel URL, for example https://cartora.vercel.app
        sync: false
      - key: MONGO_URL # full Atlas connection string, ending in /cartora
        sync: false
      # Needed for real emails (one-time codes). Without them the API refuses to send mail in production.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: EMAIL_USER # the Gmail address that sends the emails
        sync: false
      # Render creates these random values for you:
      - key: JWT_SECRET
        generateValue: true
