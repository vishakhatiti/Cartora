<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cartora: a marketplace where one account can both buy and sell." />
    <meta name="theme-color" content="#a84a22" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cartora</title>
    <script>
      // Apply the saved or system theme before first paint so the page never flashes the wrong colors.
      (function () {
        var themes = ['light', 'dark', 'sage'];
        try {
          var saved = localStorage.getItem('cartora-theme');
          var theme = themes.indexOf(saved) > -1 ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
